name: Squad Heartbeat (Ralph)
# ⚠️ SYNC: This workflow is maintained in 4 locations. Changes must be applied to all:
#   - templates/workflows/squad-heartbeat.yml (source template)
#   - packages/squad-cli/templates/workflows/squad-heartbeat.yml (CLI package)
#   - .squad/templates/workflows/squad-heartbeat.yml (installed template)
#   - .github/workflows/squad-heartbeat.yml (active workflow)
# Run 'squad upgrade' to sync installed copies from source templates.

on:
  # React to completed work or new squad work
  issues:
    types: [closed, labeled]
  pull_request:
    types: [closed]

  # Manual trigger
  workflow_dispatch:

permissions:
  issues: write
  contents: read
  pull-requests: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check triage script
        id: check-script
        run: |
          if [ -f ".squad/templates/ralph-triage.js" ]; then
            echo "has_script=true" >> $GITHUB_OUTPUT
          else
            echo "has_script=false" >> $GITHUB_OUTPUT
            echo "⚠️ ralph-triage.js not found — run 'squad upgrade' to install"
          fi

      - name: Ralph — Smart triage
        if: steps.check-script.outputs.has_script == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .squad/templates/ralph-triage.js \
            --squad-dir .squad \
            --output triage-results.json

      - name: Ralph — Apply triage decisions
        if: steps.check-script.outputs.has_script == 'true' && hashFiles('triage-results.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'triage-results.json';
            if (!fs.existsSync(path)) {
              core.info('No triage results — board is clear');
              return;
            }
            
            const results = JSON.parse(fs.readFileSync(path, 'utf8'));
            const routingContent = fs.readFileSync('.squad/routing.md', 'utf8');
            const routingMatch = routingContent.match(
              /## Operative Named-Member Routing[\s\S]*?```json\s*(\{[\s\S]*?\})\s*```/
            );
            if (!routingMatch) {
              core.setFailed('routing.md lacks operative routing JSON; refusing triage decisions');
              return;
            }
            const routingState = JSON.parse(routingMatch[1]);
            const activeMemberIds = new Set(routingState.active_members);
            const coordinator = routingState.coordinator;
            if (!activeMemberIds.has(coordinator)) {
              core.setFailed('routing coordinator must be in active_members; refusing triage decisions');
              return;
            }
            const labelFor = (target) =>
              routingState.issue_label_pattern.replace('{member-id}', target);
            const targetFromLabel = (label) =>
              typeof label === 'string' && label.startsWith('squad:')
                ? label.slice('squad:'.length).toLowerCase()
                : '';
            if (results.length === 0) {
              core.info('📋 Board is clear — Ralph found no untriaged issues');
              return;
            }
            
            for (const decision of results) {
              try {
                const requestedTarget = String(
                  decision.target || targetFromLabel(decision.label)
                ).toLowerCase();
                const requestedLabel = labelFor(requestedTarget);
                const routingApproved =
                  activeMemberIds.has(requestedTarget) &&
                  decision.label === requestedLabel;
                const target = routingApproved ? requestedTarget : coordinator;
                const authorizedLabel = labelFor(target);
                const apiRouteAllowed =
                  activeMemberIds.has(target) &&
                  authorizedLabel === labelFor(target);

                // The label triggers squad-issue-assign, so guard this API directly.
                if (apiRouteAllowed) {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: decision.issueNumber,
                    labels: [authorizedLabel]
                  });
                } else {
                  throw new Error(`refusing unauthorized triage target "${target}"`);
                }
                
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: decision.issueNumber,
                  body: [
                    '### 🔄 Ralph — Auto-Triage',
                    '',
                    `**Routed to:** ${target}`,
                    `**Reason:** ${routingApproved
                      ? decision.reason
                      : `Rejected target "${requestedTarget || 'unknown'}"; coordinator triage required`}`,
                    `**Source:** ${routingApproved ? decision.source : 'routing-fallback'}`,
                    '',
                    '> Ralph auto-triaged this issue using routing rules.',
                    '> To reassign, swap the `squad:*` label.'
                  ].join('\n')
                });
                
                core.info(`Triaged #${decision.issueNumber} → ${target} (${routingApproved ? decision.source : 'routing-fallback'})`);
              } catch (e) {
                core.warning(`Failed to triage #${decision.issueNumber}: ${e.message}`);
              }
            }
            
            core.info(`🔄 Ralph triaged ${results.length} issue(s)`);

      # Copilot auto-assign step (uses PAT if available)
      - name: Ralph — Assign @copilot issues
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.COPILOT_ASSIGN_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const teamFile = '.squad/team.md';
            const routingContent = fs.readFileSync('.squad/routing.md', 'utf8');
            const routingMatch = routingContent.match(
              /## Operative Named-Member Routing[\s\S]*?```json\s*(\{[\s\S]*?\})\s*```/
            );
            if (!routingMatch) {
              core.setFailed('routing.md lacks operative routing JSON; refusing Copilot assignment');
              return;
            }
            const routingState = JSON.parse(routingMatch[1]);
            const activeMemberIds = new Set(routingState.active_members);
            const copilotAllowed = activeMemberIds.has('copilot');
            const content = fs.existsSync(teamFile)
              ? fs.readFileSync(teamFile, 'utf8')
              : '';
            const hasCopilot = content.includes('🤖 Coding Agent') || content.includes('@copilot');
            const autoAssign = content.includes('<!-- copilot-auto-assign: true -->');

            if (!copilotAllowed) {
              core.info('Copilot is not in operative active_members; assignment disabled');
            } else if (hasCopilot && autoAssign) {
              // Find issues labeled squad:copilot with no assignee.
              try {
                const { data: copilotIssues } = await github.rest.issues.listForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  labels: 'squad:copilot',
                  state: 'open',
                  per_page: 5
                });

                const unassigned = copilotIssues.filter(i =>
                  !i.assignees || i.assignees.length === 0
                );

                if (unassigned.length === 0) {
                  core.info('No unassigned squad:copilot issues');
                } else {
                  const { data: repoData } = await github.rest.repos.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo
                  });

                  for (const issue of unassigned) {
                    try {
                      const assignmentAllowed =
                        activeMemberIds.has('copilot') &&
                        (issue.labels || []).some((label) =>
                          (typeof label === 'string' ? label : label.name) === 'squad:copilot'
                        );
                      // Do not rely on an earlier return: guard the assignment API itself.
                      if (assignmentAllowed) {
                        await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/assignees', {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: issue.number,
                          assignees: ['copilot-swe-agent[bot]'],
                          agent_assignment: {
                            target_repo: `${context.repo.owner}/${context.repo.repo}`,
                            base_branch: repoData.default_branch,
                            custom_instructions: `Read .squad/team.md for team context and .squad/routing.md for routing rules.`
                          }
                        });
                        core.info(`Assigned copilot-swe-agent[bot] to #${issue.number}`);
                      } else {
                        core.warning(`Refused unauthorized Copilot assignment to #${issue.number}`);
                      }
                    } catch (e) {
                      core.warning(`Failed to assign @copilot to #${issue.number}: ${e.message}`);
                    }
                  }
                }
              } catch (e) {
                core.info(`No squad:copilot label found or error: ${e.message}`);
              }
            } else {
              core.info('Copilot roster or auto-assign marker is absent; assignment disabled');
            }
